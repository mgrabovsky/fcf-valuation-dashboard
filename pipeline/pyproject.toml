[project]
name = "ahp-pipeline"
version = "0.1.0"
description = "ETL pipeline for the AHP macro valuation dashboard."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "jsonschema>=4.25.1",
  "polars>=1.30.0",
  "pydantic>=2.11.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-httpx>=0.35.0",
  "ruff>=0.12.0",
  "ty>=0.0.1a16"
]

[project.scripts]
ahp-pipeline = "ahp_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahp_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]

