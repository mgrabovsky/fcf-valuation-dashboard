name: Pages

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - data/**
      - schema/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/configure-pages@v6
      - run: corepack enable
      - run: cd app && yarn install --immutable
      - run: cd app && BASE_PATH="/${{ github.event.repository.name }}" yarn build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build
      - id: deployment
        uses: actions/deploy-pages@v4
